<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151d"><title>Paperbagcrew World — V0.2</title><style>
*{box-sizing:border-box}body{margin:0;background:#0e131c;color:#f9f4e8;font:15px/1.4 system-ui,-apple-system,sans-serif;overflow:hidden}header{height:62px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff1c}header strong{font-size:17px;letter-spacing:2px}header strong span{color:#ffcd4c}header small{color:#aab2c1;font-size:11px;letter-spacing:1px}.stage{height:calc(100dvh - 62px);position:relative;overflow:hidden;background:#80c1e0}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;left:16px;top:16px;background:#101722db;border:1px solid #ffffff26;border-radius:14px;padding:12px 15px;pointer-events:none;max-width:70%}.hud b{font-size:16px;letter-spacing:1px}.hud small{display:block;color:#d4d6d9;font-size:12px}.tag{position:absolute;top:16px;right:16px;background:#ffd15a;color:#17202b;border-radius:20px;padding:7px 12px;font-size:11px;font-weight:900;letter-spacing:1px}.joy{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));left:20px;display:grid;grid-template-columns:repeat(3,52px);gap:4px;user-select:none;touch-action:none}.joy button{width:52px;height:52px;border:1px solid #ffffff72;border-radius:15px;background:#111b2cc9;color:#fff;font-size:23px;touch-action:none}.joy button:active,.action:active{background:#ffcb52;color:#111}.action{position:absolute;bottom:calc(36px + env(safe-area-inset-bottom));right:20px;border:0;background:#ffcb52;color:#141820;border-radius:50%;width:76px;height:76px;font-weight:900;box-shadow:0 6px 22px #0005}.toast{position:absolute;bottom:calc(128px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:max-content;max-width:90%;text-align:center;padding:12px 18px;background:#121924ec;border:1px solid #ffffff44;border-radius:12px;display:none}.help{position:absolute;left:50%;top:80px;transform:translateX(-50%);color:#26313e;background:#fffae7d9;padding:7px 12px;border-radius:30px;font-size:12px;white-space:nowrap}@media(min-width:900px){.joy{left:30px}.action{right:40px}}
</style></head><body><header><strong>PAPERBAGCREW <span>WORLD</span></strong><small>V0.2 · CITY PREVIEW</small></header><main class="stage" id="stage"><canvas id="city" aria-label="Interactive illustrated 3D-style city"></canvas><div class="hud"><b id="place">DOWNTOWN PLAZA</b><small>Explore the city · Find your crew</small></div><div class="tag">FREE ROAM</div><div class="help" id="help">Walk toward a destination to explore</div><div class="joy"><span></span><button data-dir="up" aria-label="Move up">↑</button><span></span><button data-dir="left" aria-label="Move left">←</button><button data-dir="down" aria-label="Move down">↓</button><button data-dir="right" aria-label="Move right">→</button></div><button class="action" id="enter">ENTER</button><div class="toast" id="toast" role="status"></div></main><script>
const canvas=document.getElementById('city'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage'),place=document.getElementById('place'),toast=document.getElementById('toast');let W=0,H=0,dpr=1;const player={x:0,y:2.4};let active=new Set(),last=0,toastUntil=0;const spots=[{x:-3.9,y:-2.8,label:'DZ STUDIO',color:'#e88d75',roof:'#bd695c',desc:'Character customization is coming soon.'},{x:0,y:-3.9,label:'CREW SHOP',color:'#f2c96c',roof:'#b88b3e',desc:'Digital streetwear collections are coming soon.'},{x:4,y:-2.7,label:'SKATE PARK',color:'#8bc7b9',roof:'#56978b',desc:'Skate sessions are coming soon.'},{x:4.1,y:3.7,label:'CREW LOFT',color:'#aaaddd',roof:'#777db2',desc:'Your personal space is coming soon.'}];function resize(){dpr=Math.min(devicePixelRatio||1,2);W=stage.clientWidth;H=stage.clientHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function proj(x,y,z=0){const scale=Math.min(W/13,H/13,75);return {x:W/2+(x-y)*scale*.75,y:H*.49+(x+y)*scale*.35-z*scale}}function poly(points,color,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=color;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}function rect3(x,y,w,d,h,c,roof){const a=proj(x,y),b=proj(x+w,y),cc=proj(x+w,y+d),e=proj(x,y+d),at=proj(x,y,h),bt=proj(x+w,y,h),ct=proj(x+w,y+d,h),et=proj(x,y+d,h);poly([a,b,bt,at],c);poly([b,cc,ct,bt],shade(c,-24));poly([at,bt,ct,et],roof);return {at,bt,ct,et}}function shade(hex,n){const a=hex.match(/\w\w/g).map(x=>Math.max(0,Math.min(255,parseInt(x,16)+n)));return '#'+a.map(x=>x.toString(16).padStart(2,'0')).join('')}function line(a,b,color,width=2){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}function ellipse(p,rx,ry,c){ctx.beginPath();ctx.ellipse(p.x,p.y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()}function label(txt,p,color='#fff',size=13){ctx.fillStyle=color;ctx.font='900 '+size+'px system-ui';ctx.textAlign='center';ctx.shadowColor='#0009';ctx.shadowBlur=5;ctx.fillText(txt,p.x,p.y);ctx.shadowBlur=0}function character(){const p=proj(player.x,player.y),s=Math.max(.75,Math.min(1.25,W/650));ellipse({x:p.x,y:p.y+8*s},19*s,8*s,'#1e263b55');ctx.lineCap='round';line({x:p.x,y:p.y-42*s},{x:p.x,y:p.y-13*s},'#181c24',12*s);line({x:p.x,y:p.y-18*s},{x:p.x-12*s,y:p.y+4*s},'#181c24',8*s);line({x:p.x,y:p.y-18*s},{x:p.x+12*s,y:p.y+4*s},'#181c24',8*s);line({x:p.x-4*s,y:p.y-39*s},{x:p.x-17*s,y:p.y-15*s},'#181c24',7*s);line({x:p.x+4*s,y:p.y-39*s},{x:p.x+17*s,y:p.y-15*s},'#181c24',7*s);const hx=p.x-22*s,hy=p.y-96*s;poly([{x:hx+3*s,y:hy},{x:hx+43*s,y:hy-2*s},{x:hx+45*s,y:hy+45*s},{x:hx+37*s,y:hy+51*s},{x:hx+3*s,y:hy+49*s},{x:hx,y:hy+41*s}],'#c99c65','#977049');line({x:hx+5*s,y:hy+7*s},{x:hx+40*s,y:hy+5*s},'#e0b67e',2*s);ellipse({x:hx+15*s,y:hy+25*s},4.2*s,7*s,'#16191b');ellipse({x:hx+31*s,y:hy+25*s},4.2*s,7*s,'#16191b');label('DZ',{x:hx+34*s,y:hy+46*s},'#3d2b1d',9*s)}function draw(){ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#83c6e6');bg.addColorStop(.55,'#cde4dd');bg.addColorStop(1,'#e4cba5');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);poly([proj(-10,-10),proj(10,-10),proj(10,10),proj(-10,10)],'#e9d8b6');for(let t=-9;t<=9;t+=2){line(proj(t,-10),proj(t,10),'#d9c5a0',1);line(proj(-10,t),proj(10,t),'#d9c5a0',1)}poly([proj(-2.1,-10),proj(2.1,-10),proj(2.1,10),proj(-2.1,10)],'#667687');poly([proj(-10,-1.7),proj(10,-1.7),proj(10,1.7),proj(-10,1.7)],'#667687');for(let t=-9;t<10;t+=2){line(proj(0,t),proj(0,t+.9),'#f2e5b9',3);line(proj(t,0),proj(t+.9,0),'#f2e5b9',3)}const ordered=spots.slice().sort((a,b)=>(a.x+a.y)-(b.x+b.y));for(const b of ordered){const h=b.label==='CREW SHOP'?2.7:2.1;const box=rect3(b.x-1.05,b.y-1.05,2.1,2.1,h,b.color,b.roof);const center=proj(b.x,b.y,h+.25);label(b.label,center,'#202533',Math.min(15,W/27));const door=proj(b.x,b.y+1.07,.3);ellipse(door,10,6,'#1a2535');for(let i=0;i<3;i++){const p=proj(b.x-.65+i*.65,b.y+1.07,1.25);ellipse(p,5,8,'#3b5367')}}for(let i=0;i<10;i++){const x=(i*7%17)-8,y=(i*11%17)-8;if(Math.abs(x)<3||Math.abs(y)<3)continue;const p=proj(x,y);ellipse(p,11,5,'#487e62');line({x:p.x,y:p.y},{x:p.x,y:p.y-17},'#76573b',4);ellipse({x:p.x,y:p.y-22},15,14,'#6ba27b')}character();requestAnimationFrame(draw)}requestAnimationFrame(draw);function nearby(){let best=null,dist=2.2;for(const b of spots){const d=Math.hypot(player.x-b.x,player.y-b.y);if(d<dist){dist=d;best=b}}return best}function move(dt){let dx=(active.has('right')?1:0)-(active.has('left')?1:0),dy=(active.has('down')?1:0)-(active.has('up')?1:0);if(dx||dy){const l=Math.hypot(dx,dy);player.x=Math.max(-7,Math.min(7,player.x+dx/l*dt*3));player.y=Math.max(-7,Math.min(7,player.y+dy/l*dt*3))}const n=nearby();place.textContent=n?n.label:'DOWNTOWN PLAZA';requestAnimationFrame(tick)}function tick(t){const dt=Math.min((t-last)/1000||0,.06);last=t;move(dt)}requestAnimationFrame(tick);const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};addEventListener('keydown',e=>{if(map[e.key]){e.preventDefault();active.add(map[e.key])}});addEventListener('keyup',e=>{if(map[e.key])active.delete(map[e.key])});addEventListener('blur',()=>active.clear());document.querySelectorAll('[data-dir]').forEach(b=>{const d=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);active.add(d)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>active.delete(d))});document.getElementById('enter').onclick=()=>{const n=nearby();toast.textContent=n?n.desc:'Move closer to a building to explore.';toast.style.display='block';clearTimeout(toastUntil);toastUntil=setTimeout(()=>toast.style.display='none',3000)};setTimeout(()=>document.getElementById('help').style.display='none',6000);
</script></body></html>
