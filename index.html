<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12151b"><title>Paperbagcrew World — Art District</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#10141c;color:#fff;font:15px system-ui,-apple-system,sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:#11151b}header strong{letter-spacing:1.5px;font-size:clamp(14px,3vw,20px)}header strong span{color:#f9c953}header small{color:#aab0bc;font-size:11px;letter-spacing:1px}.frame{position:relative;width:min(100%,1500px);margin:auto;overflow:hidden;background:#17202b}.frame img{display:block;width:100%;height:auto}.hotspot{position:absolute;border:2px solid #ffd45b;outline:1px solid #111a;box-shadow:0 4px 18px #0009;background:#111b26dd;color:#fff;border-radius:30px;font-size:clamp(9px,1.5vw,14px);font-weight:800;padding:8px 13px;transform:translate(-50%,-50%);cursor:pointer;white-space:nowrap}.hotspot:focus-visible,.hotspot:hover{background:#ffd45b;color:#151515}.studio{left:32%;top:27%}.shop{left:75%;top:27%}.skate{left:18%;top:69%}.loft{left:77%;top:72%}.hint{text-align:center;color:#b8bec7;padding:16px;font-size:13px}.modal{position:fixed;inset:0;background:#06090cbd;display:none;place-items:center;padding:20px;z-index:10}.modal.open{display:grid}.panel{width:min(100%,460px);border:1px solid #e9c15e55;background:linear-gradient(135deg,#30242a,#121a22);border-radius:22px;padding:28px;box-shadow:0 20px 80px #000b}.panel h2{font-size:30px;margin:12px 0}.panel p{color:#d5d7dc;line-height:1.7}.panel a,.panel button{display:inline-block;padding:13px 20px;border-radius:25px;border:0;background:#ffd15b;color:#181818;font-weight:800;text-decoration:none;cursor:pointer;margin-top:12px}.panel button{background:#353c45;color:#fff;margin-left:6px}@media(max-width:600px){header{padding:13px}header small{font-size:9px}.hotspot{padding:5px 8px;border-width:1px;font-size:9px}.hint{padding:14px}}</style></head><body><header><strong>PAPERBAGCREW <span>WORLD</span></strong><small>V0.6 · ART DISTRICT</small></header><main><div class="frame"><img src="paperbagcrew-world-map.webp" alt="Isometric Paperbagcrew creative waterfront street with DZ Studio, Crew Shop, Skate Park and Crew Loft" width="1536" height="1024"><button class="hotspot studio" data-scene="studio">DZ STUDIO ↗</button><button class="hotspot shop" data-scene="shop">CREW SHOP ↗</button><button class="hotspot skate" data-scene="skate">SKATE PARK ↗</button><button class="hotspot loft" data-scene="loft">CREW LOFT ↗</button></div><div class="hint">TAP A LOCATION TO EXPLORE · ART × FASHION × SKATE × CREATIVITY</div></main><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="sceneTitle"><div class="panel"><small>PAPERBAGCREW WORLD</small><h2 id="sceneTitle"></h2><img id="sceneImage" alt="" style="width:100%;border-radius:12px;margin-top:12px"><p id="sceneText"></p><a id="sceneLink" href="#" target="_blank" rel="noopener" hidden>EXPLORE ↗</a><button id="close">BACK TO WORLD ←</button></div></div><script>const scenes={studio:['DZ STUDIO','Original character design, art and digital creation.'],shop:['CREW SHOP','Digital streetwear and downloadable collections.'],skate:['SKATE PARK','Skateboarding, graffiti and street creativity.'],loft:['CREW LOFT','Music, ideas and community hangouts.']};const modal=document.getElementById('modal');document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{const s=scenes[b.dataset.scene];document.getElementById('sceneTitle').textContent=s[0];document.getElementById('sceneText').textContent=s[1];document.getElementById('sceneImage').src=b.dataset.scene+'.webp';modal.classList.add('open')});function close(){modal.classList.remove('open')}document.getElementById('close').onclick=close;modal.onclick=e=>{if(e.target===modal)close()};document.onkeydown=e=>{if(e.key==='Escape')close()};</script></body></html>
